# Stateless signed JWT resource-server + reviewed Flyway JDBC, test only.
protocolia.jwt.issuer=${G4_ISSUER:}
protocolia.jwt.audience=${G4_AUDIENCE:}
protocolia.jwt.jwk-set-uri=${G4_JWKS_URI:}
protocolia.jwt.read-scope=${G4_READ_SCOPE:}
protocolia.jwt.write-scope=${G4_WRITE_SCOPE:}
protocolia.jwt.test-only-allow-loopback-http=${G4_TEST_ONLY_ALLOW_LOOPBACK_HTTP:false}
spring.datasource.url=${G5_JDBC_URL}
spring.datasource.username=${G5_DB_USER}
spring.datasource.password=${G5_DB_PASSWORD:}
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
server.error.include-message=never
spring.jackson.deserialization.fail-on-unknown-properties=true
