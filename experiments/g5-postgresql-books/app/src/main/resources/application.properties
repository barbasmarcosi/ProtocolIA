# No embedded DB and no flyway clean; external ephemeral PostgreSQL only.
spring.application.name=protocolia-g5-postgres-books
spring.datasource.url=${G5_JDBC_URL}
spring.datasource.username=${G5_DB_USER}
spring.datasource.password=${G5_DB_PASSWORD:}
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.jackson.deserialization.fail-on-unknown-properties=true
server.error.include-message=never
