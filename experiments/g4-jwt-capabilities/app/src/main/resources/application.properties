# JWT resource-server pilot requires explicit trusted env configuration.
# No issuer/key/audience defaults; no Basic identity allowed in this profile.
protocolia.jwt.issuer=${G4_ISSUER:}
protocolia.jwt.audience=${G4_AUDIENCE:}
protocolia.jwt.jwk-set-uri=${G4_JWKS_URI:}
protocolia.jwt.read-scope=${G4_READ_SCOPE:}
protocolia.jwt.write-scope=${G4_WRITE_SCOPE:}
protocolia.jwt.test-only-allow-loopback-http=false
server.error.include-message=never
spring.jackson.deserialization.fail-on-unknown-properties=true
