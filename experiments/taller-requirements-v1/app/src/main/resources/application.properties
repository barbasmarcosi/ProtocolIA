spring.application.name=protocolia-taller-real-requirements
server.port=${PORT:10000}
spring.datasource.url=${TALLER_JDBC_URL:jdbc:postgresql://127.0.0.1:55439/tools_demo}
spring.datasource.username=${TALLER_DB_USER:postgres}
spring.datasource.password=${TALLER_DB_PASSWORD:}
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.jackson.deserialization.fail-on-unknown-properties=true
server.error.include-message=never
server.forward-headers-strategy=framework
