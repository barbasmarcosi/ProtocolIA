spring.application.name=protocolia-modular-generated
spring.datasource.url=${PROTOCOLIA_JDBC_URL}
spring.datasource.username=${PROTOCOLIA_JDBC_USER}
spring.datasource.password=${PROTOCOLIA_JDBC_PASSWORD}
spring.sql.init.mode=never
spring.flyway.enabled=true
# A privileged Flyway-only connection is separate from request-time DataSource.
# No change for historical generated apps until explicit runtime DB credentials are enabled.
spring.flyway.url=${PROTOCOLIA_JDBC_URL}
spring.flyway.user=${PROTOCOLIA_MIGRATION_JDBC_USER:${PROTOCOLIA_JDBC_USER}}
spring.flyway.password=${PROTOCOLIA_MIGRATION_JDBC_PASSWORD:${PROTOCOLIA_JDBC_PASSWORD}}
spring.flyway.baseline-on-migrate=false
spring.flyway.validate-on-migrate=true
spring.flyway.clean-disabled=true
spring.flyway.out-of-order=false
# BFF opt-in only: @EnableJdbcHttpSession activates Spring Session JDBC.
# Exclude Boot auto-activation for legacy/demo/resource-server modes.
spring.autoconfigure.exclude=org.springframework.boot.session.jdbc.autoconfigure.JdbcSessionAutoConfiguration
server.port=${PORT:8080}
server.error.include-message=never
