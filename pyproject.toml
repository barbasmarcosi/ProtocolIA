[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "protocolia"
version = "0.1.0"
description = "Provider-free contract compiler for agentic software development"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "ProtocolIA contributors"}]
dependencies = []

[project.optional-dependencies]
operator-auth = ["cryptography>=44,<47"]

[project.scripts]
protocolia = "protocolia.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
