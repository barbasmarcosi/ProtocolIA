name: quality
on:
  push:
    # Document-only pushes do not need the legacy Python and schema matrix.
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - '.github/ISSUE_TEMPLATE/**'
  # Keep PR checks even for docs: these contexts may be branch-protection gates.
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  # Supersede outdated runs on the same ref, but never cancel PR from a push.
  group: quality-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install ProtocolIA with Ed25519 tests extra
        run: python -m pip install '.[operator-auth]'
      - name: Install pinned test-only JSON Schema validator
        run: python -m pip install jsonschema==4.25.1
      - name: Run unit, golden, and adversarial tests
        run: python -m unittest discover -s tests -v
      - name: Installed CLI smoke and regeneration
        run: |
          protocolia validate examples/sales.json
          protocolia compile examples/sales.json --out generated
          protocolia compile examples/sales.json --out generated
          python -m compileall -q src
  artifact-conformance:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install compiler and separate OpenAPI verifier
        run: |
          python -m pip install .
          python -m pip install openapi-spec-validator==0.7.2
      - name: Generate in isolated directory
        run: protocolia compile examples/sales.json --out "$RUNNER_TEMP/protocolia-artifacts"
      - name: Independently validate OpenAPI 3.1
        run: python tools/verify_artifacts.py "$RUNNER_TEMP/protocolia-artifacts/openapi.json"
      - name: Typecheck generated wire types with pinned TypeScript
        run: |
          npm install --no-save --ignore-scripts --no-audit --no-fund typescript@5.8.3
          ./node_modules/.bin/tsc --strict --noEmit --skipLibCheck --target ES2022 "$RUNNER_TEMP/protocolia-artifacts/types.ts"
      - name: Check compiled v0.2 OpenAPI/TypeScript using independent validators
        run: |
          protocolia validate examples/sales-v0.2.json
          protocolia compile examples/sales-v0.2.json --out "$RUNNER_TEMP/protocolia-v02"
          python tools/verify_artifacts.py "$RUNNER_TEMP/protocolia-v02/openapi.json"
          ./node_modules/.bin/tsc --strict --noEmit --skipLibCheck --target ES2022 "$RUNNER_TEMP/protocolia-v02/types.ts"
  contract-schema-conformance:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install provider-free compiler and independent schema validator
        run: |
          python -m pip install .
          python -m pip install jsonschema==4.25.1
      - name: Validate normative schema and negative/positive corpus
        run: python tools/check_contract_schema.py
  v02-schema-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install compiler and pinned independent validator
        run: |
          python -m pip install .
          python -m pip install jsonschema==4.25.1
      - name: Assert v0.2 grammar, payload semantics, strict negative gates
        run: |
          python tools/check_v02_schema.py
          python -m unittest tests.test_v02 -v
      - name: Migration and read-only output preview smoke
        run: |
          protocolia migrate examples/sales.json > "$RUNNER_TEMP/sales-migrated.json"
          protocolia validate "$RUNNER_TEMP/sales-migrated.json"
          protocolia preview examples/sales-v0.2.json --out "$RUNNER_TEMP/pristine-output"
          test ! -d "$RUNNER_TEMP/pristine-output"
