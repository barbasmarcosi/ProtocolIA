name: one-time-protocolia-merged-branch-prune
on:
  push:
    branches: [feature/v1.1-generic-if-match-conformance-20261020]
    paths: [.github/workflows/one-time-protocolia-merged-branch-prune.yml]
permissions:
  contents: write
concurrency:
  group: protocolia-one-time-branch-prune
  cancel-in-progress: false
jobs:
  prune:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Prune only pinned, ancestor-only, unprotected, unreferenced branches
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          test "$GH_REPO" = "barbasmarcosi/ProtocolIA"
          deleted=0
          skipped=0
          open_pr_heads="$(gh api "repos/$GH_REPO/pulls?state=open&per_page=100" --jq '.[].head.ref')"
          while IFS='|' read -r branch expected; do
            test -n "$branch" || continue
            case "$branch" in
              docs/p2-*|docs/p3-*|docs/p3b*|feature/b1-*) ;;
              *) echo "::error::Not on narrow cleanup allowlist: $branch"; exit 1 ;;
            esac
            case "$branch" in
              main|independent/*|feature/v1.1-*|experiments/*|feature/vnext-*) exit 1 ;;
            esac
            if printf '%s\n' "$open_pr_heads" | grep -Fxq "$branch"; then
              echo "SKIP_OPEN_PR $branch"; ((skipped+=1)); continue
            fi
            current="$(gh api "repos/$GH_REPO/git/ref/heads/$branch" --jq '.object.sha' 2>/dev/null || true)"
            if [[ "$current" != "$expected" ]]; then
              echo "SKIP_CHANGED_OR_MISSING $branch"; ((skipped+=1)); continue
            fi
            protected="$(gh api "repos/$GH_REPO/branches/$branch" --jq '.protected')"
            if [[ "$protected" != "false" ]]; then
              echo "SKIP_PROTECTED $branch"; ((skipped+=1)); continue
            fi
            ahead="$(gh api "repos/$GH_REPO/compare/main...$branch" --jq '.ahead_by')"
            if [[ "$ahead" != "0" ]]; then
              echo "SKIP_UNMERGED $branch ahead=$ahead"; ((skipped+=1)); continue
            fi
            gh api -X DELETE "repos/$GH_REPO/git/refs/heads/$branch" >/dev/null
            echo "PRUNED_PINNED_ANCESTOR $branch $expected"
            ((deleted+=1))
          done <<'PINNED'
          docs/p2-java-spring-target|1035853593db260be8820308569a65f841a482ee
          docs/p2-verified-closure|e501e7b40a25c4f007726ef8051955d8b0870f7a
          docs/p3-a-evidence-and-isolation-plan|bc13c3ad8af3be5685c61576d703d3a47ebb0fff
          docs/p3-b3b4-verified-gate-status|9c281bc65b970545ef38d23f343a45c0ea0f40f9
          docs/p3b1-verified-state|aa72ce3d3a1d7f5f2b21b88e0d509d4e3c389e15
          docs/p3b2-readonly-broker-evidence|193757208fbeb7dd8662a11cdaca187fa05d9342
          docs/p3b22-auth-evidence|2272e2cb4375893871d952e89c4ed26d32065407
          feature/b1-2-conditional-required-fields-20261015|a6f887a6ab38c177441ff29bf875bb0f4b7d52bd
          feature/b1-3-date-order-20261015|e2abe39ad2e0b74944ea5e512739abf9e6ab8c1b
          feature/b1-3c-exact-decimal-order-20261016|cd1b0895b2ea039ebf1ca584f3d1e0b045a2465d
          feature/b1-3d-forbidden-combination-20261016|5439f4dc041343dcf1e65a7842c7ae85d970a9f3
          feature/b1-4-generated-form-sections-20261016|f6dd03b69be27183c2d377053fab599f90b61c4c
          feature/b1-4-numeric-field-20261015|2eb71273c9bb344d14278fa589144f06ec26b108
          feature/b1-exact-decimals-20261015|f394ad1a336f48c8e19cfaae3853d4838da56896
          feature/b1-typespec-enum-contracts-20261015|043aee42a7b01cd7a31133df411404892fba1294
          PINNED
          echo "PROTOCOLIA_PRUNE_RESULT deleted=$deleted skipped=$skipped"
