name: R4 exact frozen Qwen output forensic technical PostgreSQL replay
on:
  pull_request:
    paths:
      - 'experiments/r4-frozen-qwen-20261107/**'
      - 'scripts/research/r4-qwen-forensic-replay.mjs'
      - '.github/workflows/r4-qwen-forensic-replay.yml'
      - 'docs/research/autonomous-engineering/R4_QWEN_FORENSIC_REPLAY.md'
      - 'scripts/research/r4-verified-checkpoint-restore.mjs'
      - 'scripts/research/r4-evolution-exercise.mjs'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  forensic-technical-only:
    name: original Qwen artifact, verified PostgreSQL and crash restore (${{ matrix.target }})
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    strategy:
      fail-fast: false
      matrix:
        target: [nestjs, modular-spring]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-java@v4
        if: matrix.target == 'modular-spring'
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Check frozen replay source
        run: node --check scripts/research/r4-qwen-forensic-replay.mjs
      - name: Generate pristine real source-bound application
        shell: bash
        run: |
          set -euo pipefail
          npm run app:build -- examples/vnext/taller \
            --target "${{ matrix.target }}" \
            --out "$RUNNER_TEMP/r4-qwen-original" --passport
      - name: Verify actual Qwen archive, preserve original failure, replay exact TypeSpec against real PostgreSQL
        shell: bash
        run: |
          set -euo pipefail
          node scripts/research/r4-qwen-forensic-replay.mjs \
            "$RUNNER_TEMP/r4-qwen-original" "${{ matrix.target }}"
