name: v1.2h-s2c1c0-provider-envelope-preflight
on:
  pull_request:
    branches: [main]
    paths:
      - 'packages/adapters/nest/**'
      - 'packages/adapters/modular/**'
      - 'packages/adapters/provider-statement-reconciliation.mjs'
      - 'tests/vnext/provider-statement-*.test.mjs'
      - 'tests/vnext/provider-webhook-envelope.test.mjs'
      - 'tests/vnext/provider-envelope-inbox.test.mjs'
      - 'packages/adapters/provider-envelope-inbox.mjs'
      - 'packages/adapters/provider-journal-upgrade.mjs'
      - 'tests/vnext/provider-journal-upgrade.test.mjs'
      - 'packages/adapters/provider-journal-runtime-isolation.mjs'
      - 'tests/vnext/provider-journal-runtime-isolation.test.mjs'
      - 'scripts/vnext/probe-provider-inbox.mjs'
      - 'scripts/vnext/probe-provider-http.mjs'
      - 'packages/adapters/nest/generate.mjs'
      - 'packages/adapters/modular/generate.mjs'
      - 'tests/vnext/ProviderWebhookVerifierTest.java'
      - '.github/workflows/v12h-s2c1c0-provider-envelope.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: s2c1c0-envelope-${{ github.ref }}
  cancel-in-progress: true
jobs:
  cross-language-envelope-and-generated-app:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        target: [nestjs, modular-spring]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: npm ci
      - name: Verify strict raw-body HMAC and adversarial Node vectors
        run: node --experimental-strip-types --test tests/vnext/provider-webhook-envelope.test.mjs
      - name: Verify identical Java cryptographic fixture and rejection vectors
        run: |
          mkdir -p "${{ runner.temp }}/provider-proof-classes"
          javac -d "${{ runner.temp }}/provider-proof-classes" \
            packages/adapters/modular/templates/ProviderWebhookVerifier.java \
            tests/vnext/ProviderWebhookVerifierTest.java
          java -cp "${{ runner.temp }}/provider-proof-classes" \
            dev.protocolia.modular.ProviderWebhookVerifierTest
      - name: Unit-check opt-in provider inbox schema and fail-closed contracts
        run: node --test tests/vnext/provider-envelope-inbox.test.mjs tests/vnext/provider-journal-upgrade.test.mjs tests/vnext/provider-journal-runtime-isolation.test.mjs
      - name: Validate pinned one-shot migrator and ingress Compose isolation contracts
        run: node --test tests/vnext/runtime-stage.test.mjs
      - name: Verify exact, provider-neutral exported receipt snapshots
        run: node --test tests/vnext/provider-statement-export.test.mjs tests/vnext/provider-statement-reconciliation.test.mjs tests/vnext/provider-statement-multi-anomaly.test.mjs tests/vnext/provider-statement-cli.test.mjs
      - name: Generate independent target from unchanged canonical workshop TypeSpec
        run: npm run app:build -- examples/vnext/workshop-itemized-guard --target ${{ matrix.target }} --out "${{ runner.temp }}/provider-preflight-app"
      - name: Real PostgreSQL and HTTP generated conformance, no provider calls
        run: npm run app:test -- "${{ runner.temp }}/provider-preflight-app"
      - name: Real PostgreSQL concurrent replay and rollback in generated target
        run: node scripts/vnext/probe-provider-inbox.mjs "${{ runner.temp }}/provider-preflight-app"
      - name: Real sandbox signed HTTP ingress, replay and PostgreSQL assertions
        run: node scripts/vnext/probe-provider-http.mjs "${{ runner.temp }}/provider-preflight-app"
