name: v1.2h-s2c-offline-statement-reconciliation
on:
  pull_request:
    branches: [main]
    paths:
      - 'packages/adapters/provider-statement-reconciliation.mjs'
      - 'packages/adapters/provider-statement-input.mjs'
      - 'packages/adapters/provider-statement-signature.mjs'
      - 'packages/adapters/provider-statement-local-replay.mjs'
      - 'packages/adapters/provider-statement-event-replay.mjs'
      - 'scripts/vnext/reconcile-provider-statement.mjs'
      - 'tests/vnext/provider-statement-*.test.mjs'
      - '.github/workflows/v12h-s2c-offline-reconciliation.yml'
  push:
    branches: [main]
    paths:
      - 'packages/adapters/provider-statement-reconciliation.mjs'
      - 'packages/adapters/provider-statement-input.mjs'
      - 'packages/adapters/provider-statement-signature.mjs'
      - 'packages/adapters/provider-statement-local-replay.mjs'
      - 'packages/adapters/provider-statement-event-replay.mjs'
      - 'scripts/vnext/reconcile-provider-statement.mjs'
      - 'tests/vnext/provider-statement-*.test.mjs'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: s2c-reconciliation-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  offline-non-authoritative-comparison:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Syntax verify CLI and independent reconciliation module
        run: |
          node --check packages/adapters/provider-statement-reconciliation.mjs
          node --check packages/adapters/provider-statement-input.mjs
          node --check packages/adapters/provider-statement-signature.mjs
          node --check packages/adapters/provider-statement-local-replay.mjs
          node --check packages/adapters/provider-statement-event-replay.mjs
          node --check scripts/vnext/reconcile-provider-statement.mjs
      - name: Exact statement comparison, exceptions, and actual CLI exit codes
        run: node --test tests/vnext/provider-statement-reconciliation.test.mjs tests/vnext/provider-statement-multi-anomaly.test.mjs tests/vnext/provider-statement-input.test.mjs tests/vnext/provider-statement-cli.test.mjs tests/vnext/provider-statement-signature.test.mjs tests/vnext/provider-statement-local-replay.test.mjs tests/vnext/provider-statement-event-replay.test.mjs tests/vnext/provider-statement-replay-dirfd-race.test.mjs
