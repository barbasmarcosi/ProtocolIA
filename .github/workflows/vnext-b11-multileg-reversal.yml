name: vnext-b11-multileg-reversal
on:
  push:
    branches: [feature/b11-multileg-reversal-20261017]
    paths:
      - 'packages/**'
      - 'examples/vnext/multi-leg-reversal/**'
      - 'tests/vnext/multi-leg-reversal.test.mjs'
      - 'scripts/vnext/probe-multi-leg-reversal-http.mjs'
      - '.github/workflows/vnext-b11-multileg-reversal.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: b11-reversal-${{ github.ref }}
  cancel-in-progress: true
jobs:
  reversible-batch:
    strategy:
      fail-fast: false
      matrix:
        target: [nestjs, modular-spring]
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-java@v4
        if: matrix.target == 'modular-spring'
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: npm ci
      - name: Compile TypeSpec and verify B8-B11 contract invariants
        run: |
          npm run build:vnext
          node --test tests/vnext/stock-transfer.test.mjs tests/vnext/stock-reversal.test.mjs tests/vnext/multi-leg-settlement.test.mjs tests/vnext/multi-leg-reversal.test.mjs
      - name: Generate app from reversible TypeSpec
        run: npm run app:build -- examples/vnext/multi-leg-reversal --target ${{ matrix.target }} --out "${RUNNER_TEMP}/b11-app"
      - name: Generated app with ephemeral PostgreSQL
        run: npm run app:test -- "${RUNNER_TEMP}/b11-app"
      - name: Install Chromium
        run: |
          npm install --no-save --ignore-scripts playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: End-to-end reversal, concurrency, audit and generated mobile React
        run: node scripts/vnext/probe-multi-leg-reversal-http.mjs "${RUNNER_TEMP}/b11-app"
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: b11-multi-leg-reversal-${{ matrix.target }}
          path: ${{ runner.temp }}/b11-app/b11-batch-reversal-mobile.png
          if-no-files-found: error
