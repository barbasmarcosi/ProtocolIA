name: v1.2d-exact-workshop-payment
on:
  push:
    branches: [feature/v1.2d-exact-workshop-payment-20261030]
    paths:
      - 'examples/vnext/workshop-payment-guard/**'
      - 'scripts/vnext/probe-workshop-payment-guard.mjs'
      - 'scripts/vnext/probe-charge-source-negative.mjs'
      - '.github/workflows/v12d-exact-workshop-payment.yml'
      - 'packages/cli/**'
      - 'packages/compiler/**'
      - 'packages/contracts/**'
      - 'packages/adapters/**'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: v12d-workshop-${{ github.ref }}
  cancel-in-progress: true
jobs:
  real-payment-guard:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        target: [nestjs, modular-spring]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-java@v4
        if: matrix.target == 'modular-spring'
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: npm ci
      - name: Generate checked-payment workshop app solely from TypeSpec
        run: npm run app:build -- examples/vnext/workshop-payment-guard --target ${{ matrix.target }} --out "${{ runner.temp }}/v12d-workshop-app"
      - name: Prove fail-closed compiler rejection of unsafe charge-source contracts
        run: node scripts/vnext/probe-charge-source-negative.mjs
      - name: Generic HTTP/DB conformance against isolated PostgreSQL
        run: npm run app:test -- "${{ runner.temp }}/v12d-workshop-app"
      - name: Frozen independent financial guard, concurrent overpay, reversal and reconciliation
        run: node scripts/vnext/probe-workshop-payment-guard.mjs "${{ runner.temp }}/v12d-workshop-app"
