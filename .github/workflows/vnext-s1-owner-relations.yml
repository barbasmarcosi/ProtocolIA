name: vnext-s1-owner-relations
on:
  push:
    branches:
      - feature/s1d2-owner-related-insert-20261016
    paths:
      - 'packages/**'
      - 'examples/vnext/owner-relations/**'
      - 'tests/vnext/owner-relations.test.mjs'
      - 'scripts/vnext/probe-owner-relations-http.mjs'
      - '.github/workflows/vnext-s1-owner-relations.yml'
permissions:
  contents: read
concurrency:
  group: s1-relations-${{ github.ref }}
  cancel-in-progress: true
jobs:
  relation-conformance:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        target: [nestjs, modular-spring]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-java@v4
        if: matrix.target == 'modular-spring'
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: npm ci
      - name: Generate TypeSpec owner-relation system
        run: npm run app:build -- examples/vnext/owner-relations --target ${{ matrix.target }} --out "${RUNNER_TEMP}/s1-owner-relations"
      - name: Adversarial source and IR contracts
        run: node --test tests/vnext/owner-relations.test.mjs
      - name: Generated PostgreSQL Compose conformance
        run: npm run app:test -- "${RUNNER_TEMP}/s1-owner-relations"
      - name: Install Chromium
        if: matrix.target == 'nestjs'
        run: |
          npm install --no-save --ignore-scripts playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Independent cross-owner relation HTTP oracle
        run: node scripts/vnext/probe-owner-relations-http.mjs "${RUNNER_TEMP}/s1-owner-relations" ${{ matrix.target == 'nestjs' && '--browser' || '' }}
      - name: Preserve browser evidence
        if: matrix.target == 'nestjs' && success()
        uses: actions/upload-artifact@v4
        with:
          name: s1-owner-relation-mobile
          path: ${{ runner.temp }}/s1-owner-relations/s1-owner-relation-mobile.png
          if-no-files-found: error
