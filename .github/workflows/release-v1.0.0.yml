name: release-v1.0.0
on:
  push:
    branches: [main]
    paths:
      - '.protocolia-release/v1.0.0.yml'
permissions:
  contents: read
jobs:
  contract-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Verify compiler and typed v1 contract
        run: |
          npm run build:vnext
          node --test tests/vnext/dynamic-order-versioned.test.mjs
  database-browser:
    needs: contract-smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        target: [nestjs, modular-spring]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-java@v4
        if: matrix.target == 'modular-spring'
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: npm ci
      - name: Generate the v1 application
        run: npm run app:build -- examples/vnext/dynamic-order-versioned --target ${{ matrix.target }} --out "${{ runner.temp }}/v1-release-app"
      - name: Install pinned real browser
        run: |
          npm install --no-save --ignore-scripts playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Verify PostgreSQL concurrency, rollback and generated React UI
        run: node scripts/vnext/probe-versioned-order-http.mjs "${{ runner.temp }}/v1-release-app"
  tag-exact-tested-main:
    needs: [contract-smoke, database-browser]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Create immutable v1.0.0 tag on the tested main commit
        uses: actions/github-script@v7
        with:
          script: |
            const {owner, repo} = context.repo;
            const tag = 'v1.0.0';
            const sha = context.sha;
            const main = await github.rest.repos.getBranch({owner, repo, branch:'main'});
            if (main.data.commit.sha !== sha) {
              throw new Error('main moved during release verification; refusing to tag a stale commit');
            }
            try {
              const existing = await github.rest.git.getRef({owner,repo,ref:'tags/'+tag});
              if (existing.data.object.sha !== sha) {
                throw new Error('Refusing to move existing '+tag+' from '+existing.data.object.sha);
              }
              core.info(tag+' already points at '+sha);
            } catch (error) {
              if (error.status !== 404) throw error;
              await github.rest.git.createRef({owner,repo,ref:'refs/tags/'+tag,sha});
              core.info('Created '+tag+' at '+sha);
            }
