name: P2 role-pinned tenant RLS proof (operator-only)

on:
  pull_request:
    paths:
      - 'packages/adapters/tenant-rls-role-candidate.mjs'
      - 'packages/adapters/nest/generate.mjs'
      - 'packages/adapters/modular/generate.mjs'
      - 'scripts/research/tenant-rls-role-candidate.mjs'
      - 'scripts/research/tenant-rls-role-e2e.sh'
      - 'tests/research/tenant-rls-role-candidate.test.mjs'
      - 'docs/research/autonomous-engineering/P2_TENANT_RLS_ROLE_S0.md'
      - '.github/workflows/p2-tenant-rls-role-candidate.yml'
  workflow_dispatch:

jobs:
  candidate-role-rls-real-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Source-bound RLS candidate unit and syntax
        shell: bash
        run: |
          set -euo pipefail
          node --check packages/adapters/tenant-rls-role-candidate.mjs
          node --check scripts/research/tenant-rls-role-candidate.mjs
          bash -n scripts/research/tenant-rls-role-e2e.sh
          node --test tests/research/tenant-rls-role-candidate.test.mjs tests/research/tenant-maker-v07.test.mjs
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run build:vnext
      - name: Emit canonical v0.7 TypeSpec, compiled IR and both generated RLS candidates
        shell: bash
        run: |
          set -euo pipefail
          TMP="$(mktemp -d "$PWD/.p2-role-rls.XXXXXXXX")"
          echo "RLS_TMP=$TMP" >> "$GITHUB_ENV"
          node scripts/research/state-only-operator-intake.mjs generate \
            research/autonomous-engineering/samples/state-only-service-ticket-v07.json "$TMP/contract"
          node scripts/research/state-only-operator-intake.mjs verify \
            research/autonomous-engineering/samples/state-only-service-ticket-v07.json "$TMP/contract"
          ./node_modules/.bin/tsp compile "$TMP/contract"
          IR="$TMP/contract/tsp-output/@protocolia/compiler/ir.json"
          OAPI="$TMP/contract/tsp-output/@typespec/openapi3/openapi.json"
          node scripts/research/tenant-rls-role-candidate.mjs "$IR" "$TMP/rls.sql"
          node packages/adapters/nest/generate.mjs "$IR" "$OAPI" "$TMP/nest"
          node packages/adapters/modular/generate.mjs "$IR" "$OAPI" "$TMP/spring"
          cmp "$TMP/rls.sql" "$TMP/nest/protocolia-tenant-rls-role-candidate.sql"
          cmp "$TMP/rls.sql" "$TMP/spring/protocolia-tenant-rls-role-candidate.sql"
          if grep -E 'ENABLE ROW LEVEL SECURITY|FORCE ROW LEVEL SECURITY' \
               "$TMP/nest/src/schema.sql" \
               "$TMP/spring/src/main/resources/db/migration/V1__contract_baseline.sql"; then
            echo "RLS candidate was silently activated in generated migrations" >&2
            exit 1
          fi
          echo "PROTOCOLIA_RLS_CANDIDATE_TARGET_PARITY_PASS"
      - name: Real disposable PostgreSQL 16 least-privilege SQL adversarial proof
        shell: bash
        env:
          PROTOCOLIA_ALLOW_DISPOSABLE_DB_TEST: 'true'
        run: |
          set -euo pipefail
          bash scripts/research/tenant-rls-role-e2e.sh "$RLS_TMP/rls.sql" \
            | tee "$RUNNER_TEMP/p2-role-rls.log"
          grep -q 'PROTOCOLIA_ROLE_PINNED_RLS_DB_PROOF_PASS' \
            "$RUNNER_TEMP/p2-role-rls.log"
