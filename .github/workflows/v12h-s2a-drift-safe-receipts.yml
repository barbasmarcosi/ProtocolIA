name: v1.2h-s2a-drift-safe-receipts
on:
  push:
    branches: [main]
    paths:
      - 'examples/vnext/workshop-payment-guard/**'
      - 'scripts/vnext/probe-workshop-payment-guard.mjs'
      - 'scripts/vnext/probe-charge-source-negative.mjs'
      - '.github/workflows/v12h-s2a-drift-safe-receipts.yml'
      - 'packages/cli/**'
      - 'packages/compiler/**'
      - 'packages/contracts/**'
      - 'packages/adapters/**'
  pull_request:
    branches: [main]
    paths:
      - 'examples/vnext/workshop-payment-guard/**'
      - 'scripts/vnext/probe-workshop-payment-guard.mjs'
      - 'scripts/vnext/probe-charge-source-negative.mjs'
      - '.github/workflows/v12h-s2a-drift-safe-receipts.yml'
      - 'packages/cli/**'
      - 'packages/compiler/**'
      - 'packages/contracts/**'
      - 'packages/adapters/**'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: v12h-s2a-drift-${{ github.ref }}
  cancel-in-progress: true
jobs:
  real-payment-guard:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        target: [nestjs, modular-spring]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-java@v4
        if: matrix.target == 'modular-spring'
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: npm ci
      - name: Generate checked-payment workshop app solely from TypeSpec
        run: npm run app:build -- examples/vnext/workshop-payment-guard --target ${{ matrix.target }} --out "${{ runner.temp }}/v12h-s2a-drift-app"
      - name: Prove fail-closed compiler rejection of unsafe charge-source contracts
        run: node scripts/vnext/probe-charge-source-negative.mjs
      - name: Generic HTTP/DB conformance against isolated PostgreSQL
        run: npm run app:test -- "${{ runner.temp }}/v12h-s2a-drift-app"
      - name: Install deterministic Chromium for generated mobile acceptance
        timeout-minutes: 12
        run: |
          # Hosted Ubuntu runners may point apt to an unreachable Azure HTTP mirror.
          # Use the public HTTPS archive to keep browser prerequisites deterministic.
          sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' /etc/apt/sources.list.d/ubuntu.sources
          npm install --no-save --ignore-scripts playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Frozen exact multi-charge financial + mobile form/HTTP acceptance
        env:
          PROTOCOLIA_BROWSER_VERIFY: 'true'
        run: node scripts/vnext/probe-workshop-payment-guard.mjs "${{ runner.temp }}/v12h-s2a-drift-app"
