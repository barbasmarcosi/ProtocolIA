name: vnext-s1-bff-housekeeping
on:
  push:
    branches:
      - feature/s1d2i2-bff-housekeeping-20261016
    paths:
      - 'packages/**'
      - 'scripts/vnext/probe-bff-browser-http.mjs'
      - '.github/workflows/vnext-s1-bff-housekeeping.yml'
permissions:
  contents: read
concurrency:
  group: s1-bff-housekeeping-${{ github.ref }}
  cancel-in-progress: true
jobs:
  bff-conformance:
    name: Housekeeping + BFF Chromium (${{ matrix.target }})
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        target: [nestjs, modular-spring]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        if: matrix.target == 'modular-spring'
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: OAuth and BFF client unit regressions
        run: node --test tests/vnext/oauth-pkce.test.mjs tests/vnext/auth-session.test.mjs tests/vnext/bff-client.test.mjs
      - name: Generate contract application
        run: npm run app:build -- examples/vnext/owner-scope --target ${{ matrix.target }} --out "${RUNNER_TEMP}/session-system"
      - name: Demo authentication regression
        run: npm run app:test -- "${RUNNER_TEMP}/session-system"
      - name: JWT resource-server regression
        run: node scripts/vnext/probe-jwt-resource-server-http.mjs "${RUNNER_TEMP}/session-system"
      - name: Install Chromium
        run: |
          npm install --no-save --ignore-scripts playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Existing OAuth2 PKCE regression
        run: node scripts/vnext/probe-oauth-browser-http.mjs "${RUNNER_TEMP}/session-system"
      - name: BFF session expiry, housekeeping, CSRF, security headers and browser
        run: node scripts/vnext/probe-bff-browser-http.mjs "${RUNNER_TEMP}/session-system"
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: s1-bff-housekeeping-${{ matrix.target }}
          path: |
            ${{ runner.temp }}/session-system/s1-oauth-pkce-mobile.png
            ${{ runner.temp }}/session-system/s1-bff-nest-mobile.png
          if-no-files-found: error
