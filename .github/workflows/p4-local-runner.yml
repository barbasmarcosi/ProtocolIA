name: p4-local-cli-runner-conformance
on:
  push:
    branches: [feat/p4-local-subscription-runner]
  pull_request:
    paths:
      - 'src/protocolia/p4_local_runner.py'
      - 'src/protocolia/p4_trial_finalize.py'
      - 'tests/test_p4_local_runner.py'
      - '.github/workflows/p4-local-runner.yml'
permissions:
  contents: read
jobs:
  simulated-subscription-cli:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11','3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install provider-free runner, not Codex or Claude Code
        run: python -m pip install .
      - name: Emulated CLI end-to-end with frozen source and external verifier
        run: python -m unittest discover -s tests -p 'test_p4_local_runner.py' -v
      - name: Confirm billing variables are refused by runner
        run: |
          python - <<'PY'
          from protocolia.p4_local_runner import FORBIDDEN_AUTH_ENV
          assert 'OPENAI_API_KEY' in FORBIDDEN_AUTH_ENV
          assert 'ANTHROPIC_API_KEY' in FORBIDDEN_AUTH_ENV
          print('P4 local runner CI: simulated only; no model sessions')
          PY
