name: vnext-s1-browser-oauth-pkce
on:
  push:
    branches:
      - feature/s1d2c-browser-oauth-pkce-20261016
    paths:
      - 'packages/**'
      - 'tests/vnext/oauth-pkce.test.mjs'
      - 'scripts/vnext/probe-oauth-browser-http.mjs'
      - '.github/workflows/vnext-s1-browser-oauth-pkce.yml'
permissions:
  contents: read
concurrency:
  group: s1-pkce-${{ github.ref }}
  cancel-in-progress: true
jobs:
  pkce-conformance:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        target: [nestjs, modular-spring]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-java@v4
        if: matrix.target == 'modular-spring'
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: npm ci
      - name: Test single-use PKCE browser client invariants
        run: node --test tests/vnext/oauth-pkce.test.mjs
      - name: Generate TypeSpec backend and React SPA
        run: npm run app:build -- examples/vnext/owner-scope --target ${{ matrix.target }} --out "${RUNNER_TEMP}/pkce-system"
      - name: Regression - demo Basic Compose
        run: npm run app:test -- "${RUNNER_TEMP}/pkce-system"
      - name: Regression - RSA JWT resource server
        run: node scripts/vnext/probe-jwt-resource-server-http.mjs "${RUNNER_TEMP}/pkce-system"
      - name: Install Chromium for true browser OAuth2 flow
        if: matrix.target == 'nestjs'
        run: |
          npm install --no-save --ignore-scripts playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: External authorization code + PKCE browser acceptance
        if: matrix.target == 'nestjs'
        run: node scripts/vnext/probe-oauth-browser-http.mjs "${RUNNER_TEMP}/pkce-system"
      - uses: actions/upload-artifact@v4
        if: matrix.target == 'nestjs' && success()
        with:
          name: s1-pkce-evidence
          path: ${{ runner.temp }}/pkce-system/s1-oauth-pkce-mobile.png
          if-no-files-found: error
